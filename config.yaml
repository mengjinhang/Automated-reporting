ollama:
  base_url: "http://localhost:11434"   # 远程地址稍后填入，如 http://192.168.1.100:11434
  model: "qwen3.5:9b"
  temperature: 0.2
  top_p: 0.8
  repeat_penalty: 1.08
  # 思考模型会先消耗一部分 token 生成 thinking，再输出 response 正文；
  # 报告脚本只读取 response，不会把 thinking 写入报告。
  num_predict: -1
  think: true
  timeout: 300
  debug_response: true

report:
  disease: "流感"
  region: "全国"
  data_source: "流感病例监测数据、多源监测数据"
  models: ["CNE", "TRCE", "Fusion"]

data:
  base_dir: "data"          # 相对脚本所在目录，跨机器可移植
  main_data: "测试数据全国_填充.xlsx"
  cne_alerts: "cne_alerts.csv"
  trce_alerts: "trce_alerts.csv"
  fusion_alerts: "critical_alerts.csv"

output:
  dir: "output"             # 相对脚本所在目录
  # 额外输出目录(可选):出 PDF 后把报告 PDF 平铺复制一份到此处,便于归档 / 外部系统直接取。
  # 留空(或删除本行)=不额外输出。建议填绝对路径;Windows 中文/空格路径用单引号,别用双引号
  # (YAML 双引号会转义反斜杠)。
  extra_pdf_dir: 'E:\UserData\PC\Desktop\Disease Surveillance and Reporting\报告\流感预警'

analysis:
  # latest_confirmed_event: 按最近一个已有病例峰值验证的完整风险事件出报告（更接近样例）
  # latest_alert: 机械选取所有模型 CSV 中时间最晚的一条预警
  current_event: "latest_confirmed_event"

# 峰值识别参数（识别主要季节性流感高峰，过滤次级肩峰）
peak_detection:
  distance: 120     # 峰值最小间隔（天）
  prominence: 100   # 峰值最小突出度
